name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ci-astro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json#packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Astro check and tsc
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Internal links in dist/
        uses: lycheeverse/lychee-action@v2
        with:
          # --index-files: a directory route needs a generated page, not just a directory.
          args: --offline --no-progress --index-files index.html --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
