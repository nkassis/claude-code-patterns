name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on ubuntu-latest.
      - name: shellcheck tracked scripts (by extension or shebang)
        run: |
          mapfile -t scripts < <(git ls-files | while IFS= read -r f; do
            case "$f" in
              *.sh | *.bash) echo "$f" ;;
              *) head -n 1 "$f" 2>/dev/null | grep -Eq '^#!.*[/ ](ba|da|k)?sh([[:space:]]|$)' && echo "$f" ;;
            esac
          done)
          [ "${#scripts[@]}" -eq 0 ] && { echo "no shell scripts"; exit 0; }
          shellcheck -x --source-path=SCRIPTDIR "${scripts[@]}"
