# Install once per clone: `uvx pre-commit install --hook-type pre-commit --hook-type pre-push`
# Append security/.pre-commit-config.yaml's `repos:` entries below.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --quiet
        language: system
        pass_filenames: false
        stages: [pre-push]
