name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ci-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup is preinstalled on ubuntu-latest; rust-toolchain.toml (if present) picks the version.
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
