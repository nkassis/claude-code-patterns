# Install once per machine: `uv tool install pre-commit`; once per clone: `pre-commit install --hook-type pre-commit --hook-type pre-push`
# Append security/.pre-commit-config.yaml's `repos:` entries below.
# pre-commit is the one hook manager for every stack, so no husky/lefthook here.
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, jsx, css, json, markdown, html]
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --max-warnings=0
        language: system
        types_or: [ts, tsx, javascript, jsx]
      - id: typecheck
        name: typecheck
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
