name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-format clang-tidy
      - name: Format
        run: git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs -0 -r clang-format --dry-run -Werror
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: clang-tidy
        run: run-clang-tidy -p build -quiet -warnings-as-errors='*'
      - name: Test (Catch2 via CTest)
        run: ctest --test-dir build --output-on-failure
