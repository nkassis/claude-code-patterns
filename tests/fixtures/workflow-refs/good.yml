# Every form check-workflow-refs.sh accepts.
on: push
jobs:
  steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: shivammathur/setup-php@2.40.0
      - uses: "actions/setup-node@v4.4.0"  # quoted, with a comment
      - uses: owner/repo/sub/action@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/local
      - uses: docker://alpine:3.20
  same-repo:
    uses: ./.github/workflows/reusable.yml
  other-repo:
    uses: owner/repo/.github/workflows/reusable.yml@11d5960a326750d5838078e36cf38b85af677262 # v1.2.3
