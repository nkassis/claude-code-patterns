name: ci

# Tier 1: cheap checks on the templates themselves. No stack toolchains are installed;
# hook test cases whose linter isn't on the runner report SKIP.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6.8.0

      - name: shellcheck
        run: shellcheck install-global.sh github/*.sh stacks/*/.claude/hooks/*.sh security/.claude/hooks/*.sh tests/*.sh

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml stacks/*/.github/workflows/*.yml security/.github/workflows/*.yml

      # This repo's workflows are locked in actions.lock, so the default policy applies: locked
      # steps pass, a reusable workflow call must be hash-pinned. The templates are locked only
      # once copied into a project, so they run with ref-pin (.github/zizmor-templates.yml).
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uvx zizmor@1.32.0 --no-progress .github/workflows/*.yml .github/dependabot.yml .pre-commit-config.yaml
          uvx zizmor@1.32.0 --no-progress --config .github/zizmor-templates.yml \
            stacks/*/.github/workflows/*.yml security/.github/workflows/*.yml \
            security/.github/dependabot.yml security/.pre-commit-config.yaml stacks/*/.pre-commit-config.yaml

      - name: Workflow refs (reusable workflows hash-pinned, no floating tags)
        run: github/check-workflow-refs.sh .github/workflows/*.yml stacks/*/.github/workflows/*.yml security/.github/workflows/*.yml

      - name: Every JSON and YAML file parses
        run: |
          git ls-files -z '*.json' '*.yml' '*.yaml' | uv run --no-project --quiet --with pyyaml python -c '
          import json, sys, yaml
          bad = 0
          for name in filter(None, sys.stdin.read().split("\0")):
              try:
                  with open(name) as f:
                      json.load(f) if name.endswith(".json") else list(yaml.safe_load_all(f))
              except Exception as e:
                  print(f"{name}: {e}")
                  bad = 1
          sys.exit(bad)
          '

      - name: Hook tests
        run: |
          uv tool install pre-commit
          bash tests/hooks.sh

      - name: Installer tests
        run: bash tests/install-global.sh

      - name: protect.sh tests
        run: bash tests/protect.sh

      - name: check-workflow-refs.sh tests
        run: bash tests/check-workflow-refs.sh

      - name: AGENTS.md / CLAUDE.md split
        run: bash tests/agents-md.sh
